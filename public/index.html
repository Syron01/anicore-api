<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniCore — Explorer</title>
<style>
:root {
  --bg:#000; --panel:#0a0a0b; --panel2:#101012; --line:#1c1c1f; --line2:#26262a;
  --text:#e7e5e0; --dim:#8a8880; --accent:#22d3ee;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { background:var(--bg); }
body {
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.55; overflow-x:hidden;
}
body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:9;
  opacity:.035; background-image:radial-gradient(#fff .5px,transparent .5px); background-size:3px 3px; }
.mono { font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace; }
a { color:inherit; text-decoration:none; }
button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:#1c1c1f; }
::-webkit-scrollbar-track { background:#000; }

.layout { display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
.side { border-right:1px solid var(--line); padding:24px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand { padding:0 24px 24px; border-bottom:1px solid var(--line); margin-bottom:16px; }
.brand h1 { font-size:18px; letter-spacing:-.02em; }
.brand span { color:var(--dim); font-size:11px; letter-spacing:3px; }
.nav-item { display:flex; align-items:center; gap:12px; width:100%; padding:12px 24px; color:var(--dim);
  font-size:14px; text-align:left; border-left:2px solid transparent; transition:color .15s; }
.nav-item:hover { color:var(--text); }
.nav-item.active { color:var(--text); border-left-color:var(--accent); background:linear-gradient(90deg,rgba(34,211,238,.06),transparent); }
.nav-item .num { font-size:11px; letter-spacing:1px; color:var(--dim); }
.nav-item.active .num { color:var(--accent); }
.side-foot { margin-top:24px; padding:16px 24px; border-top:1px solid var(--line); color:var(--dim); font-size:11px; letter-spacing:1px; }

.main { padding:32px 40px 80px; max-width:1400px; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:32px; flex-wrap:wrap; }
.kicker { color:var(--dim); font-size:11px; letter-spacing:5px; text-transform:uppercase; }
.kicker::before { content:"◆ "; color:var(--accent); }
.topright { display:flex; gap:10px; align-items:center; }
.langsel { background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:10px 12px; font-size:12px; letter-spacing:2px; outline:none; cursor:pointer; }
.langsel:focus { border-color:var(--line2); }
.searchbox { display:flex; gap:0; flex:1; max-width:520px; }
.searchbox input { flex:1; background:var(--panel); border:1px solid var(--line); border-right:none;
  color:var(--text); padding:10px 14px; font-size:14px; outline:none; min-width:0; }
.searchbox input:focus { border-color:var(--line2); }
.searchbox button { background:var(--text); color:#000; padding:0 18px; font-size:12px; letter-spacing:2px; font-weight:700; }
.searchbox select { background:var(--panel); border:1px solid var(--line); color:var(--dim); padding:0 8px; font-size:12px; outline:none; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); margin-bottom:32px; }
.stat { background:var(--panel); padding:16px 20px; }
.stat b { display:block; font-size:22px; font-weight:600; letter-spacing:-.02em; }
.stat span { color:var(--dim); font-size:10px; letter-spacing:2px; text-transform:uppercase; }

.view { display:none; }
.view.active { display:block; }
.sect { margin-bottom:16px; display:flex; align-items:baseline; gap:12px; }
.sect .num { color:var(--accent); font-size:11px; letter-spacing:2px; }
.sect h2 { font-size:18px; font-weight:600; letter-spacing:-.01em; }
.sect small { color:var(--dim); font-size:11px; letter-spacing:1px; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
.card { background:var(--panel); border:1px solid var(--line); cursor:pointer; transition:border-color .15s; overflow:hidden; }
.card:hover { border-color:#3a3a40; }
.card img { width:100%; aspect-ratio:2/3; object-fit:cover; display:block; filter:saturate(.85); }
.card .pad { padding:10px 12px 12px; }
.card .t { font-size:12.5px; font-weight:600; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:34px; }
.card .m { display:flex; justify-content:space-between; margin-top:8px; font-size:10px; letter-spacing:1px; color:var(--dim); }
.card .m b { color:var(--accent); font-weight:600; }
.skel { aspect-ratio:2/3; background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%); background-size:200% 100%; animation:sk 1.2s infinite linear; }
@keyframes sk { to { background-position:-200% 0; } }
.empty { color:var(--dim); font-size:13px; padding:32px 0; text-align:center; border:1px dashed var(--line); grid-column:1/-1; }

/* ---------------- modal (blur) ---------------- */
.overlay { position:fixed; inset:0; z-index:50; display:none; align-items:flex-start; justify-content:center;
  overflow-y:auto; padding:48px 20px; }
.overlay.open { display:flex; }
.overlay .veil { position:fixed; inset:0; background:rgba(0,0,0,.55);
  backdrop-filter:blur(24px) saturate(.6); -webkit-backdrop-filter:blur(24px) saturate(.6); }
.modal { position:relative; width:min(980px,100%); background:rgba(10,10,11,.88);
  border:1px solid var(--line2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  animation:pop .35s ease-out; }
@keyframes pop { from { opacity:0; transform:translateY(18px); } }
.m-close { position:absolute; top:10px; right:14px; z-index:3; font-size:22px; color:var(--dim);
  width:40px; height:40px; }
.m-close:hover { color:var(--text); }
.m-banner { height:180px; background-size:cover; background-position:center 25%;
  filter:blur(2px) brightness(.5) saturate(.7); border-bottom:1px solid var(--line); }
.m-banner.fallback { background:var(--panel2); }
.m-head { padding:0 28px; margin-top:-64px; position:relative; display:flex; gap:24px; }
.m-head img { width:168px; aspect-ratio:2/3; object-fit:cover; border:1px solid var(--line2);
  box-shadow:0 8px 40px rgba(0,0,0,.8); }
.m-title { flex:1; min-width:260px; padding-top:70px; }
.m-title h2 { font-size:26px; letter-spacing:-.02em; line-height:1.15; }
.m-title .sub { color:var(--dim); font-size:12px; letter-spacing:1px; margin-top:6px; }
.m-score { position:absolute; right:28px; top:-46px; text-align:right; }
.m-score b { font-size:44px; color:var(--accent); font-weight:600; letter-spacing:-.03em; }
.m-score span { display:block; color:var(--dim); font-size:10px; letter-spacing:3px; }
.m-body { padding:24px 28px 28px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font-size:10px; letter-spacing:1px; padding:4px 10px; border:1px solid var(--line2); color:var(--dim); }
.chip.acc { border-color:transparent; background:var(--accent); color:#000; font-weight:700; }
.kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:1px; background:var(--line);
  border:1px solid var(--line); margin:18px 0; }
.kv div { background:var(--panel2); padding:10px 14px; }
.kv b { display:block; font-size:13px; font-weight:600; }
.kv span { color:var(--dim); font-size:9px; letter-spacing:2px; text-transform:uppercase; }
.m-desc { color:#c9c7c1; font-size:13.5px; max-width:75ch; margin-top:4px; }
.m-ids { margin-top:14px; font-size:11px; color:var(--dim); letter-spacing:1px; display:flex; gap:14px; flex-wrap:wrap; }
.m-ids a { border-bottom:1px solid var(--line2); }
.m-ids a:hover { color:var(--accent); }
.d-section { border-top:1px solid var(--line); padding:18px 0 4px; margin-top:18px; }
.d-section h3 { font-size:11px; letter-spacing:4px; color:var(--dim); text-transform:uppercase; margin-bottom:12px; }
.d-section h3::before { content:"◆ "; color:var(--accent); }
.d-section h3 em { font-style:normal; color:var(--dim); opacity:.7; letter-spacing:1px; font-size:9px; }
.mini-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(125px,1fr)); gap:8px; }
.mini { background:var(--panel2); border:1px solid var(--line); padding:10px; font-size:11.5px; line-height:1.4; cursor:pointer; display:flex; gap:10px; }
.mini:hover { border-color:#3a3a40; }
.mini img { width:40px; height:56px; object-fit:cover; flex-shrink:0; border:1px solid var(--line); }
.mini .r { color:var(--dim); font-size:10px; letter-spacing:1px; }
.taglist { display:flex; flex-wrap:wrap; gap:5px; }
.tag { font-size:10px; letter-spacing:.5px; padding:3px 8px; border:1px solid var(--line2); color:var(--dim); }
.tag i { font-style:normal; color:var(--accent); opacity:.8; margin-left:4px; }
.extlinks { display:flex; flex-wrap:wrap; gap:8px; }
.extlinks a { border:1px solid var(--line2); padding:6px 12px; font-size:11px; letter-spacing:1px; color:var(--dim); }
.extlinks a:hover { color:var(--text); border-color:#3a3a40; }

.pill-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.pill { border:1px solid var(--line2); padding:6px 12px; font-size:11px; letter-spacing:1px; color:var(--dim); cursor:pointer; }
.pill.active { background:var(--text); color:#000; border-color:var(--text); font-weight:700; }
.term { background:var(--panel); border:1px solid var(--line); padding:20px 24px; font-size:12.5px; line-height:2; }
.term .k { color:var(--dim); display:inline-block; width:180px; }
.bar { height:6px; background:var(--panel2); border:1px solid var(--line); margin-top:8px; }
.bar i { display:block; height:100%; background:var(--accent); transition:width .5s; }

@media (prefers-reduced-motion:no-preference) { .rise { animation:rise .5s ease-out both; } }
@keyframes rise { from { opacity:0; transform:translateY(14px); } }

@media (max-width:820px) {
  .layout { grid-template-columns:1fr; }
  .side { position:static; height:auto; border-right:none; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; padding:12px 0; }
  .brand { width:100%; padding:0 16px 12px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .nav-item { width:auto; padding:10px 16px; border-left:none; border-bottom:2px solid transparent; }
  .nav-item.active { border-bottom-color:var(--accent); background:none; }
  .side-foot { display:none; }
  .main { padding:20px 16px 64px; }
  .m-head { padding:0 16px; }
  .m-title { padding-top:20px; }
  .m-title { padding-top:56px; }
  .m-body { padding:20px 16px 24px; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="side">
    <div class="brand">
      <h1>AniCore</h1>
      <span class="mono">MIRROR&nbsp;MODE</span>
    </div>
    <button class="nav-item active" data-view="trending"><span class="num mono">001</span> Trendler</button>
    <button class="nav-item" data-view="search"><span class="num mono">002</span> Arama</button>
    <button class="nav-item" data-view="top"><span class="num mono">003</span> Top Listeler</button>
    <button class="nav-item" data-view="season"><span class="num mono">004</span> Sezonlar</button>
    <button class="nav-item" data-view="mirror"><span class="num mono">005</span> Ayna / Sync</button>
    <div class="side-foot mono">DATA: ANILIST + KITSU<br>LICENSE: MIT</div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="kicker mono">ZERO&nbsp;RATE&nbsp;LIMIT&nbsp;/&nbsp;MS&nbsp;FAST</div>
      <div class="topright">
        <div class="searchbox">
          <select id="searchKind"><option value="anime">ANIME</option><option value="manga">MANGA</option></select>
          <input id="searchInput" type="search" placeholder="Ara: frieren, berserk, 葬送のフリーレン …" autofocus>
          <button id="searchBtn" class="mono">ARA</button>
        </div>
        <select id="langSel" class="langsel mono" title="Başlık dili">
          <option value="preferred">PREFERRED</option>
          <option value="english">EN</option>
          <option value="romaji">ROMAJI</option>
          <option value="native">日本語</option>
        </select>
      </div>
    </div>

    <div class="stats rise" id="stats"></div>

    <section class="view active" id="view-trending">
      <div class="sect rise"><span class="num mono">001</span><h2>Bu anın trendleri</h2><small class="mono">LIVE · ANILIST</small></div>
      <div class="grid" id="grid-trending"></div>
      <div class="sect rise" style="margin-top:40px"><span class="num mono">001b</span><h2>Bu sezon</h2><small class="mono" id="seasonNowLabel"></small></div>
      <div class="grid" id="grid-season-now"></div>
    </section>

    <section class="view" id="view-search">
      <div class="sect"><span class="num mono">002</span><h2>Sonuçlar</h2><small class="mono" id="searchMeta"></small></div>
      <div class="grid" id="grid-search"></div>
    </section>

    <section class="view" id="view-top">
      <div class="sect"><span class="num mono">003</span><h2>Top listeler</h2><small class="mono">MIRROR · FTS5</small></div>
      <div class="pill-row">
        <button class="pill active mono" data-top="anime:score">ANIME · SCORE</button>
        <button class="pill mono" data-top="anime:popularity">ANIME · POPULARITY</button>
        <button class="pill mono" data-top="manga:score">MANGA · SCORE</button>
        <button class="pill mono" data-top="manga:popularity">MANGA · POPULARITY</button>
      </div>
      <div class="grid" id="grid-top"></div>
      <button class="pill mono" id="topMore" style="margin-top:20px">DAHA FAZLA +</button>
    </section>

    <section class="view" id="view-season">
      <div class="sect"><span class="num mono">004</span><h2>Sezon gezgini</h2><small class="mono">WINTER / SPRING / SUMMER / FALL</small></div>
      <div class="pill-row">
        <select id="seasonYear" class="pill mono"></select>
        <button class="pill mono season-b" data-s="winter">WINTER</button>
        <button class="pill mono season-b" data-s="spring">SPRING</button>
        <button class="pill mono season-b" data-s="summer">SUMMER</button>
        <button class="pill mono season-b" data-s="fall">FALL</button>
      </div>
      <div class="grid" id="grid-season"></div>
    </section>

    <section class="view" id="view-mirror">
      <div class="sect"><span class="num mono">005</span><h2>Ayna durumu</h2><small class="mono">LOCAL SQLITE</small></div>
      <div class="term mono" id="mirrorTerm"></div>
      <div class="sect" style="margin-top:32px"><span class="num mono">005b</span><h2>Sağlık</h2></div>
      <div class="term mono" id="healthTerm"></div>
    </section>
  </main>
</div>

<!-- detail modal -->
<div class="overlay" id="overlay">
  <div class="veil" id="veil"></div>
  <div class="modal" id="modal"></div>
</div>

<script>
const API = location.port ? `${location.protocol}//${location.hostname}:${location.port}` : '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + 'k' : String(n);

/* ---------- language preference ---------- */
let LANG = localStorage.getItem('anilang') || 'preferred';
$('#langSel').value = LANG;
$('#langSel').addEventListener('change', () => {
  LANG = $('#langSel').value;
  localStorage.setItem('anilang', LANG);
  // instant re-render of every cached list + open modal, zero network
  for (const [sel, items] of Object.entries(LISTS)) {
    if (items) $(sel).innerHTML = items.filter(Boolean).map(cardHTML).join('');
  }
  if (DETAIL) renderModal();
});
const T = (x) => x?.title?.[LANG] || x?.title?.userPreferred || x?.title?.romaji || '—';

/* ---------- list cache for instant lang re-render ---------- */
const LISTS = {};

/* ---------------- nav ---------------- */
document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  $('#view-' + btn.dataset.view).classList.add('active');
  if (btn.dataset.view === 'mirror') refreshMirror();
}));

/* ---------------- stats ---------------- */
async function loadStats() {
  try {
    const h = await (await fetch(API + '/health')).json();
    const c = Object.fromEntries((h.db?.counts ?? []).map(x => [x.kind, x.n]));
    const rows = [
      [fmt(c.ANIME ?? 0), 'ANIME MIRROR'],
      [fmt(c.MANGA ?? 0), 'MANGA MIRROR'],
      [(h.cache?.hitRate * 100 ?? 0).toFixed(1) + '%', 'CACHE HIT'],
      [Math.round(h.uptime) + 's', 'UPTIME'],
    ];
    $('#stats').innerHTML = rows.map(([b, s]) => `<div class="stat"><b>${b}</b><span class="mono">${s}</span></div>`).join('');
  } catch { $('#stats').innerHTML = '<div class="stat"><b>—</b><span>API offline</span></div>'; }
}

/* ---------------- cards ---------------- */
function cardHTML(x) {
  const score = x.scores?.average;
  const kind = x.type === 'MANGA' ? 'MANGA' : 'ANIME';
  const meta = kind === 'ANIME' ? (x.episodes ? x.episodes + ' EP' : (x.format ?? '').toUpperCase()) : (x.chapters ? x.chapters + ' CH' : (x.format ?? '').toUpperCase());
  return `<div class="card" data-id="${x.id.anilist}" data-kind="${kind}">
    <img loading="lazy" src="${esc(x.images?.cover)}" alt="" onerror="this.style.opacity=.2">
    <div class="pad">
      <div class="t">${esc(T(x))}</div>
      <div class="m mono"><b>${score ? score : '—'}</b><span>${esc(meta)}</span></div>
    </div>
  </div>`;
}
function render(gridSel, items) {
  LISTS[gridSel] = items;
  $(gridSel).innerHTML = items.filter(Boolean).map(cardHTML).join('');
}
document.body.addEventListener('click', e => {
  const card = e.target.closest('.card, .mini[data-id]');
  if (card && card.dataset.id) openDetail(Number(card.dataset.id), card.dataset.kind ?? 'ANIME');
});

/* ---------------- trending ---------------- */
async function loadTrending() {
  const t = await (await fetch(API + '/v1/anime/trending?perPage=12')).json();
  render('#grid-trending', t.data);
  const now = new Date();
  const m = now.getMonth();
  const season = m < 2 || m === 11 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'fall';
  $('#seasonNowLabel').textContent = (season + ' ' + now.getFullYear()).toUpperCase();
  const s = await (await fetch(`${API}/v1/anime/season/${now.getFullYear()}/${season}?perPage=12`)).json();
  render('#grid-season-now', s.data);
}

/* ---------------- search ---------------- */
async function doSearch() {
  const q = $('#searchInput').value.trim();
  if (!q) return;
  const kind = $('#searchKind').value;
  const grid = '#grid-search';
  $(grid).innerHTML = '<div class="skel"></div>'.repeat(12);
  $('#searchMeta').textContent = `${kind.toUpperCase()} · ${q.toUpperCase()}`;
  switchTo('search');
  try {
    const r = await (await fetch(`${API}/v1/${kind}/search?q=${encodeURIComponent(q)}&perPage=24`)).json();
    render(grid, r.data);
    if (!r.data?.length) $(grid).innerHTML = '<div class="empty mono">Sonuç yok — farklı bir terim dene</div>';
  } catch { $(grid).innerHTML = '<div class="empty mono">Hata</div>'; }
}
$('#searchBtn').addEventListener('click', doSearch);
$('#searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
function switchTo(view) { document.querySelector(`.nav-item[data-view="${view}"]`).click(); }

/* ---------------- top ---------------- */
let topState = { kind: 'anime', by: 'score', page: 1 };
async function loadTop(reset = true) {
  if (reset) { topState.page = 1; $('#grid-top').innerHTML = '<div class="skel"></div>'.repeat(12); }
  const r = await (await fetch(`${API}/v1/${topState.kind}/top?by=${topState.by}&page=${topState.page}&perPage=24`)).json();
  const g = $('#grid-top');
  if (reset) g.innerHTML = '';
  g.insertAdjacentHTML('beforeend', r.data.map(cardHTML).join(''));
  topState.page++;
}
document.querySelectorAll('[data-top]').forEach(p => p.addEventListener('click', () => {
  document.querySelectorAll('[data-top]').forEach(x => x.classList.remove('active'));
  p.classList.add('active');
  [topState.kind, topState.by] = p.dataset.top.split(':');
  loadTop();
}));
$('#topMore').addEventListener('click', () => loadTop(false));

/* ---------------- season ---------------- */
const sy = $('#seasonYear');
for (let y = new Date().getFullYear() + 1; y >= 1960; y--) sy.insertAdjacentHTML('beforeend', `<option>${y}</option>`);
let seasonSel = 'fall';
document.querySelectorAll('.season-b').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.season-b').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  seasonSel = b.dataset.s;
  loadSeason();
}));
sy.addEventListener('change', loadSeason);
async function loadSeason() {
  const g = '#grid-season';
  $(g).innerHTML = '<div class="skel"></div>'.repeat(12);
  const r = await (await fetch(`${API}/v1/anime/season/${sy.value}/${seasonSel}?perPage=30`)).json();
  render(g, r.data);
  if (!r.data?.length) $(g).innerHTML = '<div class="empty mono">Bu sezon aynada yok</div>';
}
document.querySelector('.season-b[data-s="fall"]').classList.add('active');

/* ---------------- detail modal (single request, progressive) ---------------- */
let DETAIL = null;
$('#veil').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function closeModal() { $('#overlay').classList.remove('open'); DETAIL = null; }

function miniHTML(r, kindOverride) {
  return `<div class="mini" data-id="${r.id}" data-kind="${esc(kindOverride ?? r.type ?? 'ANIME')}">
    ${r.cover || r.image ? `<img src="${esc(r.cover ?? r.image)}" loading="lazy">` : ''}
    <div><div>${esc(r.title ?? r.name?.full)}</div>
    <div class="r mono">${esc(r.relation ?? r.role ?? '')} ${r.score ? '· ' + r.score : ''}</div></div>
  </div>`;
}

async function openDetail(id, kind) {
  if (kind === 'MANGA') { detailManga(id); return; }
  DETAIL = { id, phase: 'loading' };
  openOverlay(skeletonModal());
  const t0 = performance.now();
  const r = await (await fetch(`${API}/v1/anime/${id}/full`)).json();
  if (!DETAIL || DETAIL.id !== id) return; // user moved on
  if (!r.data) { $('#modal').innerHTML = '<div class="empty mono">Bulunamadı</div>'; return; }
  DETAIL = { id, item: r.data.media, extras: r.data, ms: Math.round(performance.now() - t0) };
  renderModal();
}

function skeletonModal() {
  return `<div class="m-banner fallback"></div>
    <div class="m-head"><div class="skel" style="width:168px;border:1px solid var(--line2)"></div>
    <div class="m-title"><h2>Yükleniyor…</h2><div class="sub mono">MIRROR → EXTRAS</div></div></div>
    <div class="m-body"><div class="skel" style="height:120px"></div></div>`;
}

function renderModal() {
  const { item: x, extras, ms } = DETAIL;
  const ids = [];
  if (x.id.anilist) ids.push(`<a href="https://anilist.co/anime/${x.id.anilist}" target="_blank">ANILIST ${x.id.anilist}</a>`);
  if (x.id.myanimelist) ids.push(`<a href="https://myanimelist.net/anime/${x.id.myanimelist}" target="_blank">MAL ${x.id.myanimelist}</a>`);
  if (x.id.kitsu) ids.push(`<a href="https://kitsu.app/anime/${x.id.kitsu}" target="_blank">KITSU ${x.id.kitsu}</a>`);

  const kv = [
    [x.dates?.start ?? '—', 'BAŞLANGIÇ'],
    [x.dates?.end ?? (x.status === 'releasing' ? 'DEVAM' : '—'), 'BİTİŞ'],
    [x.episodes ? x.episodes + ' EP' : '—', 'BÖLÜM'],
    [x.durationMinutes ? x.durationMinutes + ' DK' : '—', 'SÜRE'],
    [fmt(x.scores?.popularity ?? 0), 'POPÜLERLİK'],
    [fmt(x.scores?.favorites ?? 0), 'FAVORİ'],
    [(x.dates?.season ?? '—').toString().toUpperCase(), 'SEZON'],
    [(x.source ?? '—').toUpperCase(), 'KAYNAK'],
  ].map(([b, s]) => `<div><b>${esc(b)}</b><span class="mono">${s}</span></div>`).join('');

  const tags = (x.tags ?? []).slice(0, 18).map(t => `<span class="tag">${esc(t.name)}<i>${t.rank ?? ''}</i></span>`).join('');
  const studios = (x.studios ?? []).map(s => `<span class="tag">${esc(s.name)}</span>`).join('');
  const ext = (x.externalLinks ?? []).slice(0, 10).map(l => `<a href="${esc(l.url)}" target="_blank">${esc(l.site)}</a>`).join('');
  const trailer = x.trailer?.site === 'youtube' ? `<a href="https://youtu.be/${esc(x.trailer.id)}" target="_blank">▶ TRAILER</a>` : '';
  const syn = (x.title?.synonyms ?? []).slice(0, 8).map(s => `<span class="tag">${esc(s)}</span>`).join('');

  const chars = (extras?.characters ?? []).slice(0, 18).map(c => miniHTML(c, 'ANIME')).join('');
  const rels = (extras?.relations ?? []).slice(0, 14).map(r => miniHTML(r)).join('');
  const recs = (extras?.recommendations ?? []).slice(0, 14).map(r => miniHTML(r)).join('');

  $('#modal').innerHTML = `
    ${x.images?.banner ? `<div class="m-banner" style="background-image:url('${esc(x.images.banner)}')"></div>` : '<div class="m-banner fallback"></div>'}
    <button class="m-close" id="mclose">✕</button>
    <div class="m-head">
      <img src="${esc(x.images?.cover)}" alt="">
      <div class="m-title">
        <h2>${esc(T(x))}</h2>
        <div class="sub mono">${esc(x.title?.native ?? '')} · ${esc((x.format ?? '').toUpperCase())} · ${esc((x.status ?? '').toUpperCase())}</div>
        <div class="chips" style="margin-top:12px">
          ${(x.genres ?? []).slice(0, 6).map(g => `<span class="chip mono">${esc(g)}</span>`).join('')}
        </div>
      </div>
      ${x.scores?.average ? `<div class="m-score"><b>${x.scores.average}</b><span class="mono">SCORE</span></div>` : ''}
    </div>
    <div class="m-body">
      <div class="kv">${kv}</div>
      ${x.description ? `<p class="m-desc">${esc(x.description)}</p>` : ''}
      ${syn ? `<div class="d-section"><h3>Alternatif adlar</h3><div class="taglist">${syn}</div></div>` : ''}
      ${tags ? `<div class="d-section"><h3>Etiketler <em>ağırlık</em></h3><div class="taglist">${tags}</div></div>` : ''}
      ${studios ? `<div class="d-section"><h3>Stüdyo</h3><div class="taglist">${studios}</div></div>` : ''}
      ${(ext || trailer) ? `<div class="d-section"><h3>Bağlantılar</h3><div class="extlinks">${trailer}${ext}</div></div>` : ''}
      <div class="d-ids mono" style="margin-top:16px">${ids.join('')}<span style="opacity:.6">· ${ms}ms · ${esc(extras?._src ?? '')}</span></div>
      ${chars ? `<div class="d-section"><h3>Karakterler <em>kadro</em></h3><div class="mini-grid">${chars}</div></div>` : ''}
      ${rels ? `<div class="d-section"><h3>İlişkiler <em>franchise</em></h3><div class="mini-grid">${rels}</div></div>` : ''}
      ${recs ? `<div class="d-section"><h3>Öneriler <em>bunu beğendiyseniz</em></h3><div class="mini-grid">${recs}</div></div>` : ''}
    </div>`;
  $('#mclose').addEventListener('click', closeModal);
}

async function detailManga(id) {
  openOverlay(skeletonModal());
  const r = await (await fetch(`${API}/v1/manga/${id}`)).json();
  if (!r.data) { $('#modal').innerHTML = '<div class="empty mono">Bulunamadı</div>'; return; }
  const x = r.data;
  const kv = [
    [x.dates?.start ?? '—', 'BAŞLANGIÇ'],
    [x.chapters ? x.chapters + ' CH' : '—', 'BÖLÜM'],
    [x.volumes ? x.volumes + ' VOL' : '—', 'CİLT'],
    [fmt(x.scores?.popularity ?? 0), 'POPÜLERLİK'],
    [(x.source ?? '—').toUpperCase(), 'KAYNAK'],
  ].map(([b, s]) => `<div><b>${esc(b)}</b><span class="mono">${s}</span></div>`).join('');
  $('#modal').innerHTML = `
    <div class="m-banner fallback"></div><button class="m-close" id="mclose">✕</button>
    <div class="m-head"><img src="${esc(x.images?.cover)}">
      <div class="m-title"><h2>${esc(T(x))}</h2>
      <div class="sub mono">${esc(x.title?.native ?? '')} · MANGA · ${esc((x.status ?? '').toUpperCase())}</div>
      <div class="chips" style="margin-top:12px">${(x.genres ?? []).map(g => `<span class="chip mono">${esc(g)}</span>`).join('')}</div></div>
      ${x.scores?.average ? `<div class="m-score"><b>${x.scores.average}</b><span class="mono">SCORE</span></div>` : ''}
    </div>
    <div class="m-body"><div class="kv">${kv}</div>
    ${x.description ? `<p class="m-desc">${esc(x.description)}</p>` : ''}
    <div class="m-ids mono"><a href="https://anilist.co/manga/${x.id.anilist}" target="_blank">ANILIST ${x.id.anilist}</a>${x.id.myanimelist ? `<a href="https://myanimelist.net/manga/${x.id.myanimelist}" target="_blank">MAL ${x.id.myanimelist}</a>` : ''}</div></div>`;
  $('#mclose').addEventListener('click', closeModal);
}

function openOverlay(html) {
  $('#modal').innerHTML = html;
  $('#overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
const mo = new MutationObserver(() => {
  document.body.style.overflow = $('#overlay').classList.contains('open') ? 'hidden' : '';
});
mo.observe($('#overlay'), { attributes: true });

/* ---------------- mirror / health ---------------- */
async function refreshMirror() {
  try {
    const s = await (await fetch(API + '/v1/sync/status')).json();
    const byKind = Object.fromEntries((s.sync ?? []).map(x => [x.kind, x]));
    const counts = Object.fromEntries((s.counts ?? []).map(x => [x.kind, x.n]));
    const row = (k) => {
      const st = byKind[k] ?? {};
      const run = st.running ? '● SYNCING' : '● IDLE';
      const col = st.running ? 'var(--accent)' : 'var(--dim)';
      return `<div><span class="k">${k} MIRROR</span><span style="color:${col}">${run}</span> — <b>${fmt(counts[k] ?? 0)}</b> items · cursor ${st.last_id ?? 0} ${st.finished_at ? '· done ' + new Date(st.finished_at).toLocaleTimeString() : ''}</div>
        <div class="bar"><i style="width:${st.running ? 100 : (st.finished_at ? 100 : 0)}%"></i></div>`;
    };
    $('#mirrorTerm').innerHTML = row('ANIME') + row('MANGA') +
      `<div style="color:var(--dim)">POST /v1/sync/anime · POST /v1/sync/manga — resumable bulk mirror</div>`;
    const h = await (await fetch(API + '/health')).json();
    $('#healthTerm').innerHTML =
      `<div><span class="k">STATUS</span>${h.status.toUpperCase()}</div>
       <div><span class="k">CACHE</span>${h.cache.size} items · hit ${(h.cache.hitRate * 100).toFixed(1)}%</div>
       <div><span class="k">UPTIME</span>${Math.round(h.uptime)}s</div>
       <div><span class="k">ATTRIBUTION</span>AniList (anilist.co) · Kitsu (kitsu.app)</div>`;
  } catch {
    $('#mirrorTerm').innerHTML = '<span style="color:#e0532f">API ERİŞİLEMEZ</span>';
  }
}

/* ---------------- boot + idle warm cache ---------------- */
loadStats();
loadTrending();
loadTop();
loadSeason();
setInterval(loadStats, 15000);

// silently pre-fetch details of visible items so first clicks are always warm
let warmIdx = 0;
setInterval(() => {
  const pools = Object.values(LISTS).flat().filter(Boolean);
  if (warmIdx >= pools.length) return;
  const item = pools[warmIdx++];
  if (item?.type === 'ANIME' && item?.id?.anilist) {
    fetch(`${API}/v1/anime/${item.id.anilist}/full`).catch(() => {});
  }
}, 1500);
</script>
